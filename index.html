🎉 You finished this set!</h1><p>Great work! Ready for a new set?</p><button class="btn" onclick="newSet()">✨ I’m ready for new ${what}</button>${set>0?'<button class="btn" onclick="backSet()">↩ Go back</button>':''}`}else{clearPlace();app.innerHTML=`<button class="top" onclick="levels()">← Levels</button><h1>🎉 You finished!</h1><p>You completed all the ${what} in this level.</p>${set>0?'<button class="btn" onclick="backSet()">↩ Go back</button>':''}`}}function newSet(){stopListening();set++;i=0;tries=0;speed=0;savePlace();render();intro()}function backSet(){stopListening();if(i<=0)return;i--;tries=0;speed=0;savePlace();render();intro()}function report(){stopListening();let a=0,s=0;Object.values(progress).forEach(p=>{a+=p.attempts||0;s+=p.successes||0});const pct=a?Math.round(s/a*100):0;app.innerHTML='<button class="top" onclick="menu()">← Back</button><h1>Parent Progress 📊</h1><div class="report"><div class="stat"><b>Overall progress</b><p>'+a+' attempts • '+s+' successful • '+pct+'% success</p><div class="bar"><div class="fill" style="width:'+pct+'%"></div></div></div><div class="stat"><b>Needs another try</b><p>Items that were missed are recorded so parents can see where extra practice is needed.</p></div></div>'}menu();</script></body></html>
