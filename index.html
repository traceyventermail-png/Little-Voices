<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Little Voices</title><style>body{margin:0;background:#fff8ef;font-family:system-ui,sans-serif;color:#3d332b}.card{max-width:650px;min-height:100vh;margin:auto;background:#fff;border-radius:32px;text-align:center;padding:24px;box-sizing:border-box}.levels{display:grid;gap:14px}.level{padding:22px;border:0;border-radius:22px;font-size:24px;font-weight:800;background:#ffd36a}.level small{display:block;font-size:14px;margin-top:5px;opacity:.65}.picture{font-size:120px}.word{font-size:34px;font-weight:900;margin:15px}.parent{font-size:19px;opacity:.62}.status{font-size:22px;font-weight:800;min-height:42px;margin:20px}.top{float:left;border:0;background:none;font-weight:700}.btn{border:0;border-radius:18px;padding:13px 18px;font-size:17px;font-weight:800;background:#eee0c7;margin:7px}.skip{background:#f0e8dc}.resume{background:#dff3df;border:2px solid #83c783}.report{text-align:left;max-width:540px;margin:18px auto}.stat{background:#fff8ef;border-radius:18px;padding:16px;margin:10px 0}.bar{height:14px;background:#eadfce;border-radius:10px;overflow:hidden}.fill{height:100%;background:#d9a441;border-radius:10px}.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:#e36b5d;animation:p 1s infinite}@keyframes p{50%{transform:scale(1.5);opacity:.4}}</style></head><body><main class="card" id="app"></main><script src="vocab.js"></script><script src="vocab-more.js"></script><script>const langs=Object.keys(VOCAB),li0=0,SET_SIZE=8;let li=li0,level='easy',set=0,i=0,tries=0,speed=0,recognition=null,timer=null,session=0,paused=false;let resume=JSON.parse(localStorage.getItem('lvResume')||'null'),progress=JSON.parse(localStorage.getItem('lvProgress')||'{}');const app=document.getElementById('app'),L=()=>langs[li],pool=()=>VOCAB[L()][level].flat(),items=()=>pool().slice(set*SET_SIZE,(set+1)*SET_SIZE).map(x=>x.word??x.sentence),currentItem=idx=>pool()[set*SET_SIZE+idx],currentPicture=idx=>currentItem(idx)?.picture??'',currentMeaning=idx=>currentItem(idx)?.meaning??'';function save(){localStorage.setItem('lvProgress',JSON.stringify(progress))}function savePlace(){resume={li,level,set,i};localStorage.setItem('lvResume',JSON.stringify(resume))}function clearPlace(){resume=null;localStorage.removeItem('lvResume')}function stopListening(){session++;clearTimeout(timer);timer=null;if(recognition){try{recognition.onresult=null;recognition.onend=null;recognition.onerror=null;recognition.stop()}catch(e){}try{recognition.abort()}catch(e){}recognition=null}}function speak(text,cb,rate=.78){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=VOCAB[L()].locale;u.rate=rate;u.pitch=1.08;u.onend=()=>setTimeout(()=>{if(!paused)cb()},350);u.onerror=()=>setTimeout(()=>{if(!paused)cb()},350);speechSynthesis.speak(u)}function menu(){stopListening();app.innerHTML='<h1>Little Voices 🌟</h1><p>Which language would you like to start with?</p><div class="levels">'+langs.map((x,n)=>`<button class="level" onclick="choose(${n})">${x}</button>`).join('')+'</div>'+(resume?'<button class="btn resume" onclick="resumeNow()">💾 Continue where I left off</button>':'')+'<button class="btn" onclick="report()">👨‍👩‍👧 Parent Progress</button>'}function choose(n){stopListening();li=n;level='easy';set=0;i=0;tries=0;speed=0;levels()}function levels(){stopListening();app.innerHTML='<button class="top" onclick="menu()">← Languages</button><h1>Choose a level</h1><p>Starting with '+L()+'</p><div class="levels"><button class="level" onclick="start(\'easy\')">Easy<small>First words</small></button><button class="level" onclick="start(\'medium\')">A Bit Hard<small>Longer words</small></button><button class="level" onclick="start(\'hard\')">Hard<small>Useful everyday sentences</small></button></div>'}function start(x){stopListening();level=x;set=0;i=0;tries=0;speed=0;paused=false;savePlace();render();intro()}function resumeNow(){if(!resume)return;stopListening();li=resume.li;level=resume.level;set=resume.set;i=resume.i;tries=0;speed=0;paused=false;if(set*SET_SIZE>=pool().length){set=0;i=0}render();intro()}function render(){savePlace();const t=items()[i],pic=currentPicture(i),english=currentMeaning(i)||(level!=='medium'&&L()==='English'?t:'');app.innerHTML=`<button class="top" onclick="levels()">← Levels</button><div class="picture">${pic}</div><div class="word">${t}</div>${english?`<div class="parent">English: ${english}</div>`:''}<div class="status" id="status"></div><div id="tries"></div><button class="btn skip" onclick="skip()">⏭️ Skip for now</button><button class="btn" id="pause" onclick="togglePause()">⏸️ Pause</button>${set>0?'<button class="btn" onclick="backSet()">↩ Go back</button>':''}`}function intro(){speak('Great job! Now we are learning '+L(),teach,.78)}function teach(){if(paused)return;const t=items()[i];document.getElementById('status').textContent='Listen…';speak(t,listen,[.72,.58,.48][Math.min(speed,2)])}function listen(){if(paused)return;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){document.getElementById('status').textContent='Parent can help.';return}stopListening();const my=++session,r=new SR();recognition=r;r.lang=VOCAB[L()].locale;r.continuous=true;r.interimResults=true;r.maxAlternatives=5;let heard='',done=false;const finish=ok=>{if(done||my!==session)return;done=true;clearTimeout(timer);timer=null;try{r.stop()}catch(e){}if(ok)good();else bad()};r.onresult=e=>{if(my!==session)return;for(let n=e.resultIndex;n<e.results.length;n++){const x=e.results[n][0]?.transcript||'';heard+=' '+x;if(e.results[n].isFinal&&match(heard,items()[i]))return finish(true)}};r.onerror=()=>{if(my===session&&!done)finish(false)};r.onend=()=>{if(my===session&&!done)try{r.start()}catch(e){}};document.getElementById('status').innerHTML='<span class="dot"></span> Your turn — I’m listening';timer=setTimeout(()=>finish(match(heard,items()[i])),9000);try{r.start()}catch(e){finish(false)}}function norm(x){return x.toLowerCase().replace(/[^a-zA-ZÀ-ÿ\u00C0-\u024F\u4E00-\u9FFF\s]/g,' ').replace(/\s+/g,' ').trim()}function match(a,b){a=norm(a);b=norm(b);if(!a||!b)return false;if(a===b)return true;const A=a.split(' '),B=b.split(' ');if(level==='hard'){const h=B.filter(y=>A.some(x=>x===y)).length;return h>=Math.max(1,Math.ceil(B.length*.75))}let h=0;for(const y of B)if(A.some(x=>x===y||x.startsWith(y.slice(0,2))||y.startsWith(x.slice(0,2))))h++;return h>=Math.max(1,Math.ceil(B.length*.75))}function record(ok){const k=L()+'|'+level+'|'+set;progress[k]??={attempts:0,successes:0,misses:{}};progress[k].attempts++;if(ok)progress[k].successes++;else progress[k].misses[i]=(progress[k].misses[i]||0)+1;save()}function good(){record(true);tries=0;speed=0;document.getElementById('status').textContent='Yay! 🌟';speak('Yay!',next,.82)}function bad(){record(false);tries++;speed=Math.min(2,speed+1);document.getElementById('tries').textContent='Try '+tries+' of 3';if(tries>=3){tries=0;speak("I didn't get that. Let's try another one.",next,.78)}else speak("I didn't get that. Please repeat.",teach,.62)}function next(){if(paused)return;i++;tries=0;if(i>=items().length){i=0;finishSet();return}render();setTimeout(teach,450)}function skip(){stopListening();speechSynthesis.cancel();paused=false;i++;tries=0;speed=0;if(i>=items().length){i=0;finishSet();return}render();document.getElementById('status').textContent='Skipped. Let’s try the next one.';setTimeout(teach,650)}function togglePause(){if(paused){paused=false;render();teach()}else{paused=true;stopListening();speechSynthesis.cancel();document.getElementById('pause').textContent='▶️ Continue';document.getElementById('status').textContent='Paused — continue when ready.'}}function finishSet(){stopListening();const what=level==='hard'?'sentences':'words',hasMore=(set+1)*SET_SIZE<pool().length;if(hasMore){savePlace();app.innerHTML=`<button class="top" onclick="levels()">← Levels</button><h1>🎉 You finished this set!</h1><p>Great work! Ready for a new set?</p><button class="btn" onclick="newSet()">✨ I’m ready for new ${what}</button>${set>0?'<button class="btn" onclick="backSet()">↩ Go back</button>':''}`}else{clearPlace();app.innerHTML=`<button class="top" onclick="levels()">← Levels</button><h1>🎉 You finished!</h1><p>You completed all the ${what} in this level.</p>${set>0?'<button class="btn" onclick="backSet()">↩ Go back</button>':''}`}}function newSet(){stopListening();set++;i=0;tries=0;speed=0;savePlace();render();intro()}function backSet(){stopListening();set=Math.max(0,set-1);i=0;tries=0;speed=0;savePlace();render();intro()}function report(){stopListening();let a=0,s=0;Object.values(progress).forEach(p=>{a+=p.attempts||0;s+=p.successes||0});const pct=a?Math.round(s/a*100):0;app.innerHTML='<button class="top" onclick="menu()">← Back</button><h1>Parent Progress 📊</h1><div class="report"><div class="stat"><b>Overall progress</b><p>'+a+' attempts • '+s+' successful • '+pct+'% success</p><div class="bar"><div class="fill" style="width:'+pct+'%"></div></div></div><div class="stat"><b>Needs another try</b><p>Items that were missed are recorded so parents can see where extra practice is needed.</p></div></div>'}menu();</script></body></html>
