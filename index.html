<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#FFF8EF">
<title>Little Voices</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:system-ui,-apple-system,sans-serif;background:#fff8ef;color:#3d332b;touch-action:manipulation}.app{height:100%;display:flex;align-items:center;justify-content:center;padding:16px}.card{width:100%;height:100%;max-width:620px;border-radius:36px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 35px rgba(0,0,0,.08)}.content{text-align:center;width:100%;padding:28px}.picture{font-size:clamp(120px,35vw,210px);line-height:1;margin-bottom:30px}.start{border:0;border-radius:999px;background:#ffd36a;color:#3d332b;font-size:24px;font-weight:800;padding:20px 42px;box-shadow:0 5px 0 #e3ad3f;min-width:220px}.start:active{transform:translateY(3px);box-shadow:0 2px 0 #e3ad3f}.status{min-height:34px;margin-top:22px;font-size:22px;font-weight:800}.attempt{min-height:26px;margin-top:8px;font-size:17px;font-weight:700;opacity:.72}.version{position:fixed;bottom:8px;right:10px;font-size:11px;opacity:.35}
</style>
</head>
<body>
<div class="app"><main class="card" aria-label="Little Voices"><div class="content"><div id="picture" class="picture">🍎</div><button id="start" class="start">Start</button><div id="status" class="status" aria-live="polite"></div><div id="attempt" class="attempt"></div></div></main></div><div class="version">Little Voices v0.3</div>
<script>
const lessons=[['en-US',['apple','dog','cat','car','ball','milk','spoon','tree']],['es-ES',['manzana','perro','gato','coche','pelota','leche','cuchara','árbol']],['zh-CN',['苹果','狗','猫','汽车','球','牛奶','勺子','树']],['fr-FR',['pomme','chien','chat','voiture','balle','lait','cuillère','arbre']]];
const pics=['🍎','🐶','🐱','🚗','⚽','🥛','🥄','🌳'];
let li=0,wi=0,attempts=0,listening=false,recognition=null,round=0;
const $=id=>document.getElementById(id);
function setStatus(s){$('status').textContent=s}
function setAttempt(){ $('attempt').textContent=attempts ? `Try ${attempts} of 3` : ''; }
function cancelRecognition(){if(recognition){try{recognition.onresult=null;recognition.onerror=null;recognition.onend=null;recognition.stop()}catch(e){}recognition=null}listening=false}
function sayWord(){
 cancelRecognition();
 const myRound=round,word=lessons[li][1][wi],locale=lessons[li][0];
 setStatus('Listen…');setAttempt();speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(word);u.lang=locale;u.rate=.72;u.pitch=1.05;
 u.onend=()=>{if(myRound===round)setTimeout(startListening,1200)};
 u.onerror=()=>{if(myRound===round)setTimeout(startListening,1200)};
 speechSynthesis.speak(u);
}
function encourage(text,nextAfter){
 cancelRecognition();speechSynthesis.cancel();setStatus(text);setAttempt();
 const myRound=round,locale=lessons[li][0];
 const u=new SpeechSynthesisUtterance(text);u.lang=locale;u.rate=.82;u.pitch=1.08;
 u.onend=()=>{if(myRound===round)setTimeout(nextAfter,800)};u.onerror=()=>{if(myRound===round)setTimeout(nextAfter,800)};
 speechSynthesis.speak(u);
}
function success(){attempts=0;setAttempt();encourage('Good job! You did it!',next)}
function failure(){
 attempts++;setAttempt();
 if(attempts>=3){attempts=0;setAttempt();encourage("Let's try another word!",next)}
 else{setStatus('Good try! ❤️');setTimeout(sayWord,900)}
}
function startListening(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){setStatus('Speech recognition is not available in this browser.');return;}
 const myRound=round,target=lessons[li][1][wi].toLowerCase();
 cancelRecognition();
 const r=new SR();recognition=r;listening=true;r.lang=lessons[li][0];r.interimResults=false;r.continuous=false;r.maxAlternatives=5;
 let finished=false;
 const failOnce=()=>{if(finished||myRound!==round)return;finished=true;listening=false;failure()};
 r.onresult=e=>{if(finished||myRound!==round)return;finished=true;listening=false;const heard=[...e.results[0]].map(x=>x.transcript.toLowerCase().trim());const ok=heard.some(x=>x===target||similarity(x,target)>=.72);if(ok)success();else failure()};
 r.onerror=()=>failOnce();
 r.onend=()=>{if(!finished)failOnce()};
 try{r.start()}catch(e){failOnce()}
}
function similarity(a,b){if(a===b)return 1;if(!a||!b)return 0;const m=a.length,n=b.length,d=Array.from({length:m+1},()=>Array(n+1).fill(0));for(let i=0;i<=m;i++)d[i][0]=i;for(let j=0;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]!==b[j-1]));return 1-d[m][n]/Math.max(m,n)}
function next(){round++;cancelRecognition();attempts=0;wi++;if(wi>=lessons[li][1].length){wi=0;li=(li+1)%lessons.length}$('picture').textContent=pics[wi];setAttempt();setTimeout(sayWord,350)}
$('start').addEventListener('click',()=>{round++;attempts=0;$('start').style.display='none';sayWord()});
</script>
<!-- Little Voices v0.3: isolated speech rounds, delayed listening, and guaranteed 3-attempt progression. -->
</body></html>
