<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Little Voices</title><style>body{margin:0;background:#fff8ef;font-family:system-ui,sans-serif;color:#3d332b}.card{max-width:650px;height:100vh;margin:auto;background:#fff;border-radius:32px;text-align:center;padding:24px;box-sizing:border-box}.levels{display:grid;gap:14px}.level{padding:22px;border:0;border-radius:22px;font-size:24px;font-weight:800;background:#ffd36a}.level small{display:block;font-size:14px;margin-top:5px;opacity:.65}.picture{font-size:120px}.word{font-size:34px;font-weight:900;margin:15px}.parent{font-size:19px;opacity:.62}.syll{font-size:23px;font-weight:800;color:#9a6b25;margin:14px}.status{font-size:22px;font-weight:800;min-height:42px;margin:20px}.top{float:left;border:0;background:none;font-weight:700}.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:#e36b5d;animation:p 1s infinite}@keyframes p{50%{transform:scale(1.5);opacity:.4}}</style></head><body><main class="card" id="app"></main><script>
const langs={English:{locale:'en-US',hard:['Hello, how are you?','My name is…','I need help.','Can you help me?','Where am I?','Please help me.','I need some water.','Thank you!']},Mandarin:{locale:'zh-CN',hard:['你好，你好吗？','我的名字是……','我需要帮助。','你能帮助我吗？','我在哪里？','请帮助我。','我需要一些水。','谢谢你！']},French:{locale:'fr-FR',hard:['Bonjour, comment vas-tu ?','Je m’appelle…','J’ai besoin d’aide.','Peux-tu m’aider ?','Où suis-je ?','Aide-moi, s’il te plaît.','J’ai besoin d’eau.','Merci !']},Spanish:{locale:'es-ES',hard:['Hola, ¿cómo estás?','Me llamo…','Necesito ayuda.','¿Puedes ayudarme?','¿Dónde estoy?','Ayúdame, por favor.','Necesito agua.','¡Gracias!']}};
const easy={English:['apple','dog','cat','car','ball','milk','tree','fish'],Mandarin:['苹果','狗','猫','汽车','球','牛奶','树','鱼'],French:['pomme','chien','chat','voiture','balle','lait','arbre','poisson'],Spanish:['manzana','perro','gato','coche','pelota','leche','árbol','pez']};const medium={English:['butterfly','elephant','rainbow','banana','giraffe','sunflower','strawberry','birthday'],Mandarin:['蝴蝶','大象','彩虹','香蕉','长颈鹿','向日葵','草莓','生日'],French:['papillon','éléphant','arc-en-ciel','banane','girafe','tournesol','fraise','anniversaire'],Spanish:['mariposa','elefante','arcoíris','plátano','jirafa','girasol','fresa','cumpleaños']};const englishMeaning={easy:['apple','dog','cat','car','ball','milk','tree','fish'],medium:['butterfly','elephant','rainbow','banana','giraffe','sunflower','strawberry','birthday']};const pics=['🍎','🐶','🐱','🚗','⚽','🥛','🌳','🐟'];let level='easy',lang='English',wi=0,tries=0,speed=0,rec,timer;const app=document.getElementById('app');const words=()=>level==='hard'?langs[lang].hard:level==='easy'?easy[lang]:medium[lang];function menu(){app.innerHTML='<h1>Little Voices 🌟</h1><p>Choose a level</p><div class="levels"><button class="level" onclick="start(\'easy\')">Easy<small>First words</small></button><button class="level" onclick="start(\'medium\')">A Bit Hard<small>Longer words</small></button><button class="level" onclick="start(\'hard\')">Hard<small>Useful everyday sentences</small></button></div>'}function start(l){level=l;lang='English';wi=0;tries=0;speed=0;show();intro()}function show(){let text=words()[wi],parent=level==='hard'?langs.English.hard[wi]:englishMeaning[level][wi];app.innerHTML=`<button class="top" onclick="menu()">← Levels</button><div class="picture">${pics[wi]}</div><div class="word">${text}</div><div class="parent">English meaning: ${parent}</div><div class="syll">${level==='hard'?'Say the whole sentence naturally.':''}</div><div class="status" id="status"></div><div id="tries"></div>`}function speak(text,cb,rate=.78){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=langs[lang].locale;u.rate=rate;u.pitch=1.08;u.onend=()=>setTimeout(cb,450);u.onerror=()=>setTimeout(cb,450);speechSynthesis.speak(u)}function intro(){speak(`Great job! Now we're learning ${lang}`,teach,.78)}function teach(){let text=words()[wi],r=[.72,.58,.48][Math.min(speed,2)];document.getElementById('status').textContent='Listen…';if(level==='hard')return speak(text,listen,r);let parts=text.split(/[-\s]+/).filter(Boolean);speak(text,()=>syllables(parts,listen,r),r)}function syllables(parts,cb,rate){let i=0;function one(){if(i>=parts.length)return setTimeout(cb,400);speak(parts[i++],one,rate)}one()}function listen(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){document.getElementById('status').textContent='Parent can help.';return}if(rec)try{rec.abort()}catch(e){}let heard='';rec=new SR();rec.lang=langs[lang].locale;rec.continuous=true;rec.interimResults=true;let done=false;const finish=ok=>{if(done)return;done=true;clearTimeout(timer);try{rec.stop()}catch(e){}ok?success():fail()};rec.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++){heard+=' '+(e.results[i][0]?.transcript||'');if(e.results[i].isFinal&&match(heard,words()[wi]))return finish(true)}};rec.onerror=()=>setTimeout(()=>finish(false),200);rec.onend=()=>{if(!done)try{rec.start()}catch(e){finish(false)}};document.getElementById('status').innerHTML='<span class="dot"></span> Your turn — I’m listening';timer=setTimeout(()=>finish(false),9000);try{rec.start()}catch(e){finish(false)}}function norm(s){return s.toLowerCase().replace(/[^a-zA-ZÀ-ÿ\u00C0-\u024F\u4E00-\u9FFF\s]/g,' ').replace(/\s+/g,' ').trim()}function sim(a,b){if(a===b)return 1;let m=a.length,n=b.length,d=Array.from({length:m+1},()=>Array(n+1).fill(0));for(let i=0;i<=m;i++)d[i][0]=i;for(let j=0;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]!==b[j-1]));return 1-d[m][n]/Math.max(m,n)}function match(a,b){a=norm(a);b=norm(b);if(a===b)return true;let A=a.split(' '),B=b.split(' '),hits=0;for(let y of B)if(A.some(x=>x===y||x.startsWith(y.slice(0,2))||y.startsWith(x.slice(0,2))||sim(x,y)>=.48))hits++;return hits>=Math.max(1,Math.ceil(B.length*(level==='hard'?.4:.5)))}function success(){tries=0;speed=0;document.getElementById('status').textContent='Yay! 🌟';speak('Yay!',next,.82)}function fail(){tries++;speed=Math.min(2,speed+1);document.getElementById('tries').textContent=`Try ${tries} of 3`;if(tries>=3){tries=0;document.getElementById('status').textContent="That's okay! Let's try another one.";speak("Let's try another one.",next,.78)}else{document.getElementById('status').textContent='Good try! I’ll say it slower.';setTimeout(teach,800)}}function next(){wi++;tries=0;if(wi>=words().length){wi=0;lang=lang==='English'?'Mandarin':lang==='Mandarin'?'French':'Spanish';if(lang==='Spanish'&&level==='hard'){lang='English'}show();setTimeout(intro,700)}else{show();setTimeout(teach,500)}}menu();</script></main></body></html>
