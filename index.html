<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Little Voices</title><style>body{margin:0;background:#fff8ef;font-family:system-ui,sans-serif;color:#3d332b}.card{max-width:650px;min-height:100vh;margin:auto;background:#fff;border-radius:32px;text-align:center;padding:24px;box-sizing:border-box}.levels{display:grid;gap:14px}.level{padding:22px;border:0;border-radius:22px;font-size:24px;font-weight:800;background:#ffd36a}.level small{display:block;font-size:14px;margin-top:5px;opacity:.65}.picture{font-size:120px}.word{font-size:34px;font-weight:900;margin:15px}.parent{font-size:19px;opacity:.62}.status{font-size:22px;font-weight:800;min-height:42px;margin:20px}.top{float:left;border:0;background:none;font-weight:700}.btn{border:0;border-radius:18px;padding:13px 18px;font-size:17px;font-weight:800;background:#eee0c7;margin:7px}.skip{background:#f0e8dc}.resume{background:#dff3df;border:2px solid #83c783}.report{text-align:left;max-width:540px;margin:18px auto}.stat{background:#fff8ef;border-radius:18px;padding:16px;margin:10px 0}.bar{height:14px;background:#eadfce;border-radius:10px;overflow:hidden}.fill{height:100%;background:#d9a441;border-radius:10px}.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:#e36b5d;animation:p 1s infinite}@keyframes p{50%{transform:scale(1.5);opacity:.4}}</style></head><body><main class="card" id="app"></main><script>
const data={English:{locale:'en-US',easy:[['apple','dog','cat','car','ball','milk','tree','fish'],['house','shoe','book','chair','cookie','bird','flower','baby']],medium:[['butterfly','elephant','rainbow','banana','giraffe','sunflower','strawberry','birthday'],['umbrella','turtle','dinosaur','pineapple','firetruck','snowman','sandwich','castle']],hard:[['Hello, how are you?','My name is…','I need help.','Can you help me?','Where am I?','Please help me.','I need some water.','Thank you!'],['Good morning!','I am happy.','I would like an apple.','Where is the door?','Where is the bathroom?','Where is my parent?','I am tired.','See you later!']]},Spanish:{locale:'es-ES',easy:[['manzana','perro','gato','coche','pelota','leche','árbol','pez'],['casa','zapato','libro','silla','galleta','pájaro','flor','bebé']],medium:[['mariposa','elefante','arcoíris','plátano','jirafa','girasol','fresa','cumpleaños'],['paraguas','tortuga','dinosaurio','piña','camión de bomberos','muñeco de nieve','sándwich','castillo']],hard:[['Hola, ¿cómo estás?','Me llamo…','Necesito ayuda.','¿Puedes ayudarme?','¿Dónde estoy?','Ayúdame, por favor.','Necesito agua.','¡Gracias!'],['¡Buenos días!','Estoy feliz.','Quiero una manzana.','¿Dónde está la puerta?','¿Dónde está el baño?','¿Dónde está mi mamá o mi papá?','Estoy cansado/a.','¡Hasta luego!']]},French:{locale:'fr-FR',easy:[['pomme','chien','chat','voiture','balle','lait','arbre','poisson'],['maison','chaussure','livre','chaise','biscuit','oiseau','fleur','bébé']],medium:[['papillon','éléphant','arc-en-ciel','banane','girafe','tournesol','fraise','anniversaire'],['parapluie','tortue','dinosaure','ananas','camion de pompiers','bonhomme de neige','sandwich','château']],hard:[['Bonjour, comment vas-tu ?','Je m’appelle…','J’ai besoin d’aide.','Peux-tu m’aider ?','Où suis-je ?','Aide-moi, s’il te plaît.','J’ai besoin d’eau.','Merci !'],['Bonjour !','Je suis content(e).','Je voudrais une pomme.','Où est la porte ?','Où sont les toilettes ?','Où est mon parent ?','Je suis fatigué(e).','À plus tard !']]},Mandarin:{locale:'zh-CN',easy:[['苹果','狗','猫','汽车','球','牛奶','树','鱼'],['房子','鞋子','书','椅子','饼干','鸟','花','宝宝']],medium:[['蝴蝶','大象','彩虹','香蕉','长颈鹿','向日葵','草莓','生日'],['雨伞','乌龟','恐龙','菠萝','消防车','雪人','三明治','城堡']],hard:[['你好，你好吗？','我的名字是……','我需要帮助。','你能帮助我吗？','我在哪里？','请帮助我。','我需要一些水。','谢谢你！'],['早上好！','我很开心。','我想要一个苹果。','门在哪里？','洗手间在哪里？','我的爸爸妈妈在哪里？','我累了。','再见！']]}};
const langs=Object.keys(data),pics=['🍎','🐶','🐱','🚗','⚽','🥛','🌳','🐟'];const mediumPics={English:[['🦋','🐘','🌈','🍌','🦒','🌻','🍓','🎂'],['☂️','🐢','🦖','🍍','🚒','⛄','🥪','🏰']],Spanish:[['🦋','🐘','🌈','🍌','🦒','🌻','🍓','🎂'],['☂️','🐢','🦖','🍍','🚒','⛄','🥪','🏰']],French:[['🦋','🐘','🌈','🍌','🦒','🌻','🍓','🎂'],['☂️','🐢','🦖','🍍','🚒','⛄','🥪','🏰']],Mandarin:[['🦋','🐘','🌈','🍌','🦒','🌻','🍓','🎂'],['☂️','🐢','🦖','🍍','🚒','⛄','🥪','🏰']]};let li=0,level='easy',set=0,i=0,tries=0,speed=0,recognition=null,timer=null,session=0,paused=false;let resume=JSON.parse(localStorage.getItem('lvResume')||'null'),progress=JSON.parse(localStorage.getItem('lvProgress')||'{}');const app=document.getElementById('app'),L=()=>langs[li],items=()=>data[L()][level][set];function save(){localStorage.setItem('lvProgress',JSON.stringify(progress))}function savePlace(){resume={li,level,set,i};localStorage.setItem('lvResume',JSON.stringify(resume))}function clearPlace(){resume=null;localStorage.removeItem('lvResume')}function stopListening(){session++;clearTimeout(timer);timer=null;if(recognition){try{recognition.onresult=null;recognition.onend=null;recognition.onerror=null;recognition.stop()}catch(e){}try{recognition.abort()}catch(e){}recognition=null}}function speak(text,cb,rate=.78){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=data[L()].locale;u.rate=rate;u.pitch=1.08;u.onend=()=>setTimeout(()=>{if(!paused)cb()},350);u.onerror=()=>setTimeout(()=>{if(!paused)cb()},350);speechSynthesis.speak(u)}function menu(){stopListening();app.innerHTML='<h1>Little Voices 🌟</h1><p>Which language would you like to start with?</p><div class="levels">'+langs.map((x,n)=>`<button class="level" onclick="choose(${n})">${x}</button>`).join('')+'</div>'+(resume?'<button class="btn resume" onclick="resumeNow()">💾 Continue where I left off</button>':'')+'<button class="btn" onclick="report()">👨‍👩‍👧 Parent Progress</button>'}function choose(n){stopListening();li=n;level='easy';set=0;i=0;tries=0;speed=0;levels()}function levels(){stopListening();app.innerHTML='<button class="top" onclick="menu()">← Languages</button><h1>Choose a level</h1><p>Starting with '+L()+'</p><div class="levels"><button class="level" onclick="start(\'easy\')">Easy<small>First words</small></button><button class="level" onclick="start(\'medium\')">A Bit Hard<small>Longer words</small></button><button class="level" onclick="start(\'hard\')">Hard<small>Useful everyday sentences</small></button></div>'}function start(x){stopListening();level=x;set=0;i=0;tries=0;speed=0;paused=false;savePlace();render();intro()}function resumeNow(){if(!resume)return;stopListening();li=resume.li;level=resume.level;set=resume.set;i=resume.i;tries=0;speed=0;paused=false;render();intro()}function render(){savePlace();const t=items()[i],pic=level==='hard'?['👋','🙋','🆘','🤝','📍','🙏','💧','❤️'][i]:level==='medium'?mediumPics[L()][set][i]:pics[i];app.innerHTML=`<button class="top" onclick="levels()">← Levels</button><div class="picture">${pic}</div><div class="word">${t}</div><div class="parent">English meaning: ${L()==='English'?t:'See the English meaning in the learning prompt.'}</div><div class="status" id="status"></div><div id="tries"></div><button class="btn skip" onclick="skip()">⏭️ Skip for now</button><button class="btn" id="pause" onclick="togglePause()">⏸️ Pause</button>${set>0?'<button class="btn" onclick="backSet()">↩ Go back</button>':''}`}function intro(){speak('Great job! Now we are learning '+L(),teach,.78)}function teach(){if(paused)return;const t=items()[i];document.getElementById('status').textContent='Listen…';speak(t,listen,[.72,.58,.48][Math.min(speed,2)])}function listen(){if(paused)return;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){document.getElementById('status').textContent='Parent can help.';return}stopListening();const my=++session,r=new SR();recognition=r;r.lang=data[L()].locale;r.continuous=true;r.interimResults=true;r.maxAlternatives=5;let heard='',done=false;const finish=ok=>{if(done||my!==session)return;done=true;clearTimeout(timer);timer=null;try{r.stop()}catch(e){}if(ok)good();else bad()};r.onresult=e=>{if(my!==session)return;for(let n=e.resultIndex;n<e.results.length;n++){const x=e.results[n][0]?.transcript||'';heard+=' '+x;if(e.results[n].isFinal&&match(heard,items()[i]))return finish(true)}};r.onerror=()=>{if(my===session&&!done)finish(false)};r.onend=()=>{if(my===session&&!done)try{r.start()}catch(e){}};document.getElementById('status').innerHTML='<span class="dot"></span> Your turn — I’m listening';timer=setTimeout(()=>finish(match(heard,items()[i])),9000);try{r.start()}catch(e){finish(false)}}function norm(x){return x.toLowerCase().replace(/[^a-zA-ZÀ-ÿ\u00C0-\u024F\u4E00-\u9FFF\s]/g,' ').replace(/\s+/g,' ').trim()}function match(a,b){a=norm(a);b=norm(b);if(!a||!b)return false;if(a===b)return true;const A=a.split(' '),B=b.split(' ');let h=0;for(const y of B)if(A.some(x=>x===y||x.startsWith(y.slice(0,2))||y.startsWith(x.slice(0,2))))h++;return h>=Math.max(1,Math.ceil(B.length*(level==='hard'?.4:.5)))}function record(ok){const k=L()+'|'+level+'|'+set;progress[k]??={attempts:0,successes:0,misses:{}};progress[k].attempts++;if(ok)progress[k].successes++;else progress[k].misses[i]=(progress[k].misses[i]||0)+1;save()}function good(){record(true);tries=0;speed=0;document.getElementById('status').textContent='Yay! 🌟';speak('Yay!',next,.82)}function bad(){record(false);tries++;speed=Math.min(2,speed+1);document.getElementById('tries').textContent='Try '+tries+' of 3';if(tries>=3){tries=0;speak("I didn't get that. Let's try another one.",next,.78)}else speak("I didn't get that. Please repeat.",teach,.62)}function next(){if(paused)return;i++;tries=0;if(i>=items().length){i=0;finishSet();return}render();setTimeout(teach,450)}function skip(){stopListening();speechSynthesis.cancel();paused=false;i++;tries=0;speed=0;if(i>=items().length){i=0;finishSet();return}render();document.getElementById('status').textContent='Skipped. Let’s try the next one.';setTimeout(teach,650)}function togglePause(){if(paused){paused=false;document.getElementById('pause').textContent='⏸️ Pause';render();teach()}else{paused=true;stopListening();speechSynthesis.cancel();document.getElementById('pause').textContent='▶️ Continue';document.getElementById('status').textContent='Paused — continue when ready.'}}function finishSet(){stopListening();const what=level==='hard'?'sentences':'words';if(set<data[L()][level].length-1){savePlace();app.innerHTML=`<button class="top" onclick="levels()">← Levels</button><h1>🎉 You finished this set!</h1><p>Great work! Ready for a new set?</p><button class="btn" onclick="newSet()">✨ I’m ready for new ${what}</button>${set>0?'<button class="btn" onclick="backSet()">↩ Go back</button>':''}`}else{clearPlace();app.innerHTML=`<button class="top" onclick="levels()">← Levels</button><h1>🎉 You finished!</h1><p>You completed all the ${what} in this level.</p>${set>0?'<button class="btn" onclick="backSet()">↩ Go back</button>':''}`}}function newSet(){stopListening();set++;i=0;tries=0;speed=0;savePlace();render();intro()}function backSet(){stopListening();set=Math.max(0,set-1);i=0;tries=0;speed=0;savePlace();render();intro()}function report(){stopListening();let a=0,s=0;Object.values(progress).forEach(p=>{a+=p.attempts||0;s+=p.successes||0});const pct=a?Math.round(s/a*100):0;app.innerHTML='<button class="top" onclick="menu()">← Back</button><h1>Parent Progress 📊</h1><div class="report"><div class="stat"><b>Overall progress</b><p>'+a+' attempts • '+s+' successful • '+pct+'% success</p><div class="bar"><div class="fill" style="width:'+pct+'%"></div></div></div><div class="stat"><b>Needs another try</b><p>Items that were missed are recorded so parents can see where extra practice is needed.</p></div></div>'}menu();</script></body></html>
