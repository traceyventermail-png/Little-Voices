<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#FFF8EF"><title>Little Voices</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:system-ui,-apple-system,sans-serif;background:#fff8ef;color:#3d332b}.app{height:100%;display:flex;align-items:center;justify-content:center;padding:16px}.card{width:100%;height:100%;max-width:620px;border-radius:36px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 35px rgba(0,0,0,.08)}.content{text-align:center;width:100%;padding:28px}.picture{font-size:clamp(110px,30vw,190px);line-height:1}.word{font-size:clamp(34px,9vw,58px);font-weight:900;margin:18px 0 8px}.helper{font-size:17px;opacity:.7;margin-bottom:18px}.start{border:0;border-radius:999px;background:#ffd36a;color:#3d332b;font-size:24px;font-weight:800;padding:18px 42px;box-shadow:0 5px 0 #e3ad3f}.status{min-height:34px;margin-top:22px;font-size:22px;font-weight:800}.attempt{min-height:26px;margin-top:8px;font-size:17px;font-weight:700;opacity:.72}.version{position:fixed;bottom:8px;right:10px;font-size:11px;opacity:.35}</style></head><body><div class="app"><main class="card"><div class="content"><div id="picture" class="picture">🍎</div><div id="word" class="word">apple</div><div class="helper">Parent can help: say the word together ❤️</div><button id="start" class="start">Start</button><div id="status" class="status"></div><div id="attempt" class="attempt"></div></div></main></div><div class="version">Little Voices v0.7</div><script>
const lessons=[['en-US',['apple','dog','cat','car','ball','milk','spoon','tree']],['es-ES',['manzana','perro','gato','coche','pelota','leche','cuchara','árbol']],['zh-CN',['苹果','狗','猫','汽车','球','牛奶','勺子','树']],['fr-FR',['pomme','chien','chat','voiture','balle','lait','cuillère','arbre']]];const pics=['🍎','🐶','🐱','🚗','⚽','🥛','🥄','🌳'];let li=0,wi=0,attempts=0,speed=0,recognition=null;const $=id=>document.getElementById(id);function status(x){$('status').textContent=x}function attempt(){ $('attempt').textContent=attempts?`Try ${attempts} of 3`:'' }function word(){return lessons[li][1][wi]}function locale(){return lessons[li][0]}
function pickVoice(lang){const vs=speechSynthesis.getVoices();const exact=vs.filter(v=>v.lang.toLowerCase().startsWith(lang.slice(0,2).toLowerCase()));return exact.find(v=>/female|samantha|zira|ava|karen|moira|susan|google.*us english/i.test(v.name))||exact.find(v=>!/(robot|compact|espeak)/i.test(v.name))||exact[0]||null}
function speak(text,cb){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=locale();u.rate=text===word()?[.70,.55,.43][Math.min(speed,2)]:.80;u.pitch=text===word()?1.10:1.16;const v=pickVoice(locale());if(v)u.voice=v;u.onend=()=>setTimeout(cb,750);u.onerror=()=>setTimeout(cb,750);speechSynthesis.speak(u)}function sayWord(){status(speed?'Listen again…':'Listen…');attempt();speak(word(),listen)}function success(){attempts=0;speed=0;attempt();status('Yay! 🌟');speak('Yay!',next)}function fail(){attempts++;speed=Math.min(speed+1,2);attempt();if(attempts>=3){attempts=0;status("That's okay! Let's try a new word. 💛");speak("Let's try a new word.",next)}else{status(speed===1?'Good try! I’ll say it slower. ❤️':'Good try! Let’s try again. ❤️');setTimeout(sayWord,950)}}
function listen(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){status('Parent can help with the word above.');return}if(recognition)try{recognition.stop()}catch(e){}const r=new SR();recognition=r;r.lang=locale();r.interimResults=false;r.continuous=false;r.maxAlternatives=5;let done=false;function finish(fn){if(done)return;done=true;fn()}r.onresult=e=>finish(()=>{const target=word().toLowerCase();const heard=[...e.results[0]].map(x=>clean(x.transcript));const ok=heard.some(x=>childMatch(x,target));if(ok)success();else fail()});r.onerror=()=>finish(fail);r.onend=()=>{if(!done)finish(fail)};try{r.start()}catch(e){finish(fail)}}
function clean(s){return s.toLowerCase().trim().replace(/[^a-z0-9\u00c0-\u024f\u4e00-\u9fff\s]/gi,'').replace(/\s+/g,' ')}
function childMatch(a,b){a=clean(a);b=clean(b);if(!a||!b)return false;if(a===b)return true;const s=similarity(a,b);if(s>=.48)return true;const first=a[0]===b[0];const short=a.length<=Math.max(2,Math.ceil(b.length*.72));if(first&&short)return true;if(b.startsWith(a.slice(0,Math.max(2,Math.min(a.length,3)))))return true;if(a.startsWith(b.slice(0,Math.max(2,Math.min(b.length,3)))))return true;return false}
function similarity(a,b){if(a===b)return 1;const m=a.length,n=b.length,d=Array.from({length:m+1},()=>Array(n+1).fill(0));for(let i=0;i<=m;i++)d[i][0]=i;for(let j=0;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]!==b[j-1]));return 1-d[m][n]/Math.max(m,n)}function next(){attempts=0;wi++;if(wi>=lessons[li][1].length){wi=0;li=(li+1)%lessons.length}$('picture').textContent=pics[wi];$('word').textContent=word();attempt();setTimeout(sayWord,500)}$('start').onclick=()=>{$('start').style.display='none';attempts=0;speed=0;sayWord()};speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();</script></body></html>
