<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#FFF8EF"><title>Little Voices</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:system-ui,-apple-system,sans-serif;background:#fff8ef;color:#3d332b}.app{height:100%;display:flex;align-items:center;justify-content:center;padding:16px}.card{width:100%;height:100%;max-width:620px;border-radius:36px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 35px rgba(0,0,0,.08)}.content{text-align:center;width:100%;padding:28px}.title{font-size:clamp(34px,9vw,58px);font-weight:900;margin-bottom:12px}.subtitle{font-size:18px;opacity:.7;margin-bottom:22px}.levels{display:flex;flex-direction:column;gap:14px;max-width:390px;margin:auto}.level{border:0;border-radius:24px;padding:20px;font-size:24px;font-weight:900;background:#ffd36a;color:#3d332b;box-shadow:0 5px 0 #e3ad3f}.level small{display:block;font-size:14px;font-weight:600;opacity:.65;margin-top:4px}.picture{font-size:clamp(110px,30vw,190px);line-height:1}.word{font-size:clamp(34px,9vw,58px);font-weight:900;margin:18px 0 4px}.native{font-size:22px;font-weight:700;opacity:.55;min-height:28px}.syllables{font-size:25px;font-weight:800;letter-spacing:2px;min-height:34px;margin:10px 0;color:#9a6b25}.helper{font-size:16px;opacity:.68;margin:10px 0 18px}.status{min-height:40px;margin-top:22px;font-size:22px;font-weight:800}.listening{display:inline-flex;align-items:center;gap:9px}.dot{width:13px;height:13px;border-radius:50%;background:#e36b5d;animation:pulse 1s infinite}@keyframes pulse{50%{transform:scale(1.5);opacity:.45}}.attempt{min-height:26px;margin-top:8px;font-size:17px;font-weight:700;opacity:.72}.top{position:absolute;top:16px;left:18px;border:0;background:transparent;font-size:16px;font-weight:800;opacity:.65}.version{position:fixed;bottom:8px;right:10px;font-size:11px;opacity:.35}</style></head><body><div class="app"><main class="card"><div id="content" class="content"></div></main></div><div class="version">Little Voices v1.2</div><script>
const levels={easy:{name:'Easy',desc:'First words • short and familiar',words:[['🍎','apple','apple',['ap','ple']],['🐶','dog','dog',['dog']],['🐱','cat','cat',['cat']],['🚗','car','car',['car']],['⚽','ball','ball',['ball']],['🥛','milk','milk',['milk']],['🌳','tree','tree',['tree']],['🐟','fish','fish',['fish']] ]},medium:{name:'A Bit Hard',desc:'New words • two or more syllables',words:[['🦋','butterfly','butterfly',['but','ter','fly']],['🐘','elephant','elephant',['el','e','phant']],['🌈','rainbow','rainbow',['rain','bow']],['🍌','banana','banana',['ba','na','na']],['🦒','giraffe','giraffe',['gi','raffe']],['🚂','train','train',['train']],['🌻','sunflower','sunflower',['sun','flow','er']],['🍓','strawberry','strawberry',['straw','ber','ry']]]},hard:{name:'Hard',desc:'Longer words • more syllables',words:[['🐊','alligator','alligator',['al','li','ga','tor']],['🦖','dinosaur','dinosaur',['di','no','saur']],['🚁','helicopter','helicopter',['hel','i','cop','ter']],['🌂','umbrella','umbrella',['um','brel','la']],['🐢','turtle','turtle',['tur','tle']],['🥕','vegetable','vegetable',['veg','e','ta','ble']],['🦄','unicorn','unicorn',['u','ni','corn']],['🌍','everything','everything',['ev','ery','thing']]]}};
const translations={English:{locale:'en-US'},Mandarin:{locale:'zh-CN'},French:{locale:'fr-FR'},Spanish:{locale:'es-ES'}};let level='easy',lang='English',wi=0,attempts=0,speed=0,recognition=null,listeningTimer=null;const $=id=>document.getElementById(id);function data(){return levels[level].words[wi]}function renderLevels(){document.getElementById('content').innerHTML=`<div class="title">Little Voices 🌟</div><div class="subtitle">Choose your learning level</div><div class="levels">${Object.entries(levels).map(([k,v])=>`<button class="level" onclick="chooseLevel('${k}')">${v.name}<small>${v.desc}</small></button>`).join('')}</div>`}function chooseLevel(k){level=k;wi=0;attempts=0;speed=0;renderLesson();introduceLanguage()}function renderLesson(){const d=data();document.getElementById('content').innerHTML=`<button class="top" onclick="renderLevels()">← Levels</button><div id="picture" class="picture">${d[0]}</div><div id="word" class="word">${d[1]}</div><div id="native" class="native">${d[2]}</div><div id="syllables" class="syllables">${d[3].join(' · ')}</div><div class="helper">Parent word • English</div><div id="status" class="status"></div><div id="attempt" class="attempt"></div>`;attempt()}function attempt(){$('attempt').textContent=attempts?`Try ${attempts} of 3`:''}function speak(text,cb,rate=.78){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=translations[lang].locale;u.rate=rate;u.pitch=1.08;u.onend=()=>setTimeout(cb,550);u.onerror=()=>setTimeout(cb,550);speechSynthesis.speak(u)}function introduceLanguage(){speak(`Great job! Now we're learning ${lang}.`,()=>setTimeout(teachWord,400),.76)}function teachWord(){const d=data(),r=[.68,.54,.43][Math.min(speed,2)];$('status').textContent=speed?'Listen again…':'Listen…';attempt();speak(d[2],()=>setTimeout(()=>speak(d[3].join(' '),startListening,r),300),r)}function startListening(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('status').textContent='Parent can help with the word above.';return}if(recognition)try{recognition.abort()}catch(e){}let heard='';const r=new SR();recognition=r;r.lang=translations[lang].locale;r.interimResults=true;r.continuous=true;r.maxAlternatives=5;let done=false;const finish=ok=>{if(done)return;done=true;clearTimeout(listeningTimer);try{r.stop()}catch(e){}ok?success():fail()};r.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++){heard+=' '+(e.results[i][0]?.transcript||'');if(e.results[i].isFinal&&childMatch(clean(heard),clean(data()[2]))){finish(true);return}}};r.onerror=()=>setTimeout(()=>finish(false),250);r.onend=()=>{if(!done){try{r.start()}catch(e){finish(false)}}};$('status').innerHTML='<span class="listening"><span class="dot"></span>Your turn — I’m listening</span>';listeningTimer=setTimeout(()=>finish(false),8000);try{r.start()}catch(e){finish(false)}}function success(){attempts=0;speed=0;attempt();$('status').textContent='Yay! 🌟';speak('Yay!',next,.82)}function fail(){attempts++;speed=Math.min(speed+1,2);attempt();if(attempts>=3){attempts=0;$('status').textContent="That's okay! Let's try a new word. 💛";speak("Let's try a new word.",next,.78)}else{$('status').textContent='Good try! I’ll say it slower. ❤️';setTimeout(teachWord,850)}}function clean(s){return s.toLowerCase().trim().replace(/[^a-z\s]/g,'').replace(/\s+/g,' ')}function childMatch(a,b){if(!a||!b)return false;if(a===b)return true;const s=similarity(a,b);if(s>=.45)return true;return(a[0]===b[0]&&a.length<=Math.max(2,Math.ceil(b.length*.78)))||b.startsWith(a.slice(0,Math.max(2,Math.min(a.length,3))))}function similarity(a,b){const m=a.length,n=b.length,d=Array.from({length:m+1},()=>Array(n+1).fill(0));for(let i=0;i<=m;i++)d[i][0]=i;for(let j=0;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]!==b[j-1]));return 1-d[m][n]/Math.max(m,n)}function next(){attempts=0;wi++;if(wi>=levels[level].words.length){wi=0;lang=lang==='English'?'Mandarin':lang==='Mandarin'?'French':lang==='French'?'Spanish':'English';renderLesson();setTimeout(introduceLanguage,700);return}renderLesson();setTimeout(teachWord,500)}renderLevels();speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();</script></body></html>
