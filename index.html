<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#FFF8EF"><title>Little Voices</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:system-ui,-apple-system,sans-serif;background:#fff8ef;color:#3d332b}.app{height:100%;display:flex;align-items:center;justify-content:center;padding:16px}.card{width:100%;height:100%;max-width:620px;border-radius:36px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 35px rgba(0,0,0,.08)}.content{text-align:center;width:100%;padding:28px}.title{font-size:clamp(34px,9vw,58px);font-weight:900;margin-bottom:12px}.subtitle{font-size:18px;opacity:.7;margin-bottom:22px}.levels{display:flex;flex-direction:column;gap:14px;max-width:390px;margin:auto}.level{border:0;border-radius:24px;padding:20px;font-size:24px;font-weight:900;background:#ffd36a;color:#3d332b;box-shadow:0 5px 0 #e3ad3f;cursor:pointer}.level small{display:block;font-size:14px;font-weight:600;opacity:.65;margin-top:4px}.back{margin-top:18px;border:0;background:transparent;font-size:17px;font-weight:700;opacity:.65}.picture{font-size:clamp(110px,30vw,190px);line-height:1}.word{font-size:clamp(34px,9vw,58px);font-weight:900;margin:18px 0 4px}.native{font-size:22px;font-weight:700;opacity:.55;min-height:28px}.syllables{font-size:25px;font-weight:800;letter-spacing:2px;min-height:34px;margin:10px 0;color:#9a6b25}.helper{font-size:16px;opacity:.68;margin:10px 0 18px}.status{min-height:40px;margin-top:22px;font-size:22px;font-weight:800}.listening{display:inline-flex;align-items:center;gap:9px}.dot{width:13px;height:13px;border-radius:50%;background:#e36b5d;animation:pulse 1s infinite}@keyframes pulse{50%{transform:scale(1.5);opacity:.45}}.attempt{min-height:26px;margin-top:8px;font-size:17px;font-weight:700;opacity:.72}.top{position:absolute;top:16px;left:18px;border:0;background:transparent;font-size:16px;font-weight:800;opacity:.65}.version{position:fixed;bottom:8px;right:10px;font-size:11px;opacity:.35}</style></head><body><div class="app"><main class="card"><div id="content" class="content"></div></main></div><div class="version">Little Voices v1.1</div><script>
const lessons=[{name:'English',locale:'en-US',words:['apple','dog','cat','car','ball','milk','spoon','tree'],native:['apple','dog','cat','car','ball','milk','spoon','tree'],syll:[['ap','ple'],['dog'],['cat'],['car'],['ball'],['milk'],['spoon'],['tree']]},{name:'Mandarin',locale:'zh-CN',words:['apple','dog','cat','car','ball','milk','spoon','tree'],native:['苹果','狗','猫','汽车','球','牛奶','勺子','树'],syll:[['苹','果'],['狗'],['猫'],['汽','车'],['球'],['牛','奶'],['勺','子'],['树']]},{name:'French',locale:'fr-FR',words:['apple','dog','cat','car','ball','milk','spoon','tree'],native:['pomme','chien','chat','voiture','balle','lait','cuillère','arbre'],syll:[['pomme'],['chien'],['chat'],['voi','ture'],['balle'],['lait'],['cuill','ère'],['arbre']]},{name:'Spanish',locale:'es-ES',words:['apple','dog','cat','car','ball','milk','spoon','tree'],native:['manzana','perro','gato','coche','pelota','leche','cuchara','árbol'],syll:[['man','za','na'],['pe','rro'],['ga','to'],['co','che'],['pe','lo','ta'],['le','che'],['cu','cha','ra'],['ár','bol']]}];const pics=['🍎','🐶','🐱','🚗','⚽','🥛','🥄','🌳'];const levels={easy:{name:'Easy',desc:'Simple words and lots of support',words:8},medium:{name:'A Bit Hard',desc:'Longer words and more practice',words:8},hard:{name:'Hard',desc:'More challenging words and syllables',words:8}};let level='easy',li=0,wi=0,attempts=0,speed=0,recognition=null,listeningTimer=null;const $=id=>document.getElementById(id);function status(x){$('status').innerHTML=x}function lesson(){return lessons[li]}function word(){return lesson().words[wi]}function renderLevelPicker(){document.getElementById('content').innerHTML=`<div class="title">Little Voices 🌟</div><div class="subtitle">Choose your learning level</div><div class="levels">${Object.entries(levels).map(([k,v])=>`<button class="level" onclick="chooseLevel('${k}')">${v.name}<small>${v.desc}</small></button>`).join('')}</div>`}function chooseLevel(k){level=k;li=0;wi=0;attempts=0;speed=0;renderLesson();introduceLanguage()}function renderLesson(){document.getElementById('content').innerHTML=`<button class="top" onclick="renderLevelPicker()">← Levels</button><div id="picture" class="picture">${pics[wi]}</div><div id="word" class="word">${word()}</div><div id="native" class="native">${lesson().native[wi]}</div><div id="syllables" class="syllables">${lesson().syll[wi].join(' · ')}</div><div class="helper">Parent word • English</div><div id="status" class="status"></div><div id="attempt" class="attempt"></div>`;attempt()}
function attempt(){$('attempt').textContent=attempts?`Try ${attempts} of 3`:''}function pickVoice(lang){const vs=speechSynthesis.getVoices();const exact=vs.filter(v=>v.lang.toLowerCase().startsWith(lang.slice(0,2)));return exact.find(v=>/female|samantha|zira|ava|karen|moira|susan/i.test(v.name))||exact.find(v=>!/(robot|compact|espeak)/i.test(v.name))||exact[0]||null}function speak(text,cb,rate){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=lesson().locale;u.rate=rate??.78;u.pitch=1.08;const v=pickVoice(lesson().locale);if(v)u.voice=v;u.onend=()=>setTimeout(cb,600);u.onerror=()=>setTimeout(cb,600);speechSynthesis.speak(u)}function teachWord(cb){const parts=lesson().syll[wi],r=[.68,.54,.43][Math.min(speed,2)];status(speed?'Listen again…':'Listen…');attempt();speak(lesson().native[wi],()=>setTimeout(()=>speak(parts.join('…'),cb,r),350),r)}function introduceLanguage(){speak(`Great job! Now we're learning ${lesson().name}.`,()=>setTimeout(()=>teachWord(startListening),350),.76)}function startListening(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){status('Parent can help with the word above.');return}if(recognition)try{recognition.abort()}catch(e){}let heardText='';const r=new SR();recognition=r;r.lang=lesson().locale;r.interimResults=true;r.continuous=true;r.maxAlternatives=5;let finished=false;const endRound=ok=>{if(finished)return;finished=true;clearTimeout(listeningTimer);try{r.stop()}catch(e){}ok?success():fail()};r.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++){heardText+=' '+(e.results[i][0]?.transcript||'');if(e.results[i].isFinal&&childMatch(clean(heardText),lesson().native[wi])){endRound(true);return}}};r.onerror=()=>{if(!finished)setTimeout(()=>endRound(false),250)};r.onend=()=>{if(!finished){try{r.start()}catch(e){endRound(false)}}};status('<span class="listening"><span class="dot"></span>Your turn — I’m listening</span>');listeningTimer=setTimeout(()=>endRound(false),8000);try{r.start()}catch(e){endRound(false)}}function success(){attempts=0;speed=0;attempt();status('Yay! 🌟');speak('Yay!',next,.82)}function fail(){attempts++;speed=Math.min(speed+1,2);attempt();if(attempts>=3){attempts=0;status("That's okay! Let's try a new word. 💛");speak("Let's try a new word.",next,.78)}else{status('Good try! I’ll say it slower. ❤️');setTimeout(()=>teachWord(startListening),850)}}function clean(s){return s.toLowerCase().trim().replace(/[^a-z0-9\u00c0-\u024f\u4e00-\u9fff\s]/gi,'').replace(/\s+/g,' ')}function childMatch(a,b){a=clean(a);b=clean(b);if(!a||!b)return false;if(a===b)return true;const s=similarity(a,b);if(s>=.45)return true;const first=a[0]===b[0],short=a.length<=Math.max(2,Math.ceil(b.length*.78));return(first&&short)||b.startsWith(a.slice(0,Math.max(2,Math.min(a.length,3))))||a.startsWith(b.slice(0,Math.max(2,Math.min(b.length,3))))}function similarity(a,b){if(a===b)return 1;const m=a.length,n=b.length,d=Array.from({length:m+1},()=>Array(n+1).fill(0));for(let i=0;i<=m;i++)d[i][0]=i;for(let j=0;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]!==b[j-1]));return 1-d[m][n]/Math.max(m,n)}function next(){attempts=0;wi++;if(wi>=lesson().words.length){wi=0;li=(li+1)%lessons.length;renderLesson();setTimeout(introduceLanguage,700);return}renderLesson();setTimeout(()=>teachWord(startListening),500)}renderLevelPicker();speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();</script></body></html>
